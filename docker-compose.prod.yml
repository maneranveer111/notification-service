# Commands:
#   Start: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   Stop:  docker compose -f docker-compose.prod.yml down --remove-orphans
#   Reset: docker compose -f docker-compose.prod.yml down -v

name: notification-prod

x-backend-env: &backend-env
  ENVIRONMENT: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-notification_db}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
  API_KEY: ${API_KEY:?API_KEY is required}
  UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:?UNSUBSCRIBE_SECRET is required}
  DOMAIN: ${DOMAIN:?DOMAIN is required}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://${DOMAIN:?DOMAIN is required}/api}
  FRONTEND_URL: ${FRONTEND_URL:-https://${DOMAIN:?DOMAIN is required}}
  FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-https://${DOMAIN:?DOMAIN is required}}
  ROOT_PATH: ${ROOT_PATH:-/api}
  CELERY_QUEUE: ${CELERY_QUEUE:-notification_service_queue}
  APP_NAME: ${APP_NAME:-Notification Service}
  SIGNUP_MODE: ${SIGNUP_MODE:-invite_only}
  REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
  SYSTEM_MAIL_BACKEND: ${SYSTEM_MAIL_BACKEND:-provider}
  EMAIL_PROVIDER_ORDER: ${EMAIL_PROVIDER_ORDER:-brevo,smtp}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
  BREVO_API_KEY: ${BREVO_API_KEY:-}
  BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL:-}
  BREVO_FROM_NAME: ${BREVO_FROM_NAME:-}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-2}
  QUOTA_ENABLED: ${QUOTA_ENABLED:-true}

services:
  db:
    image: postgres:16
    command: ["postgres", "-c", "idle_in_transaction_session_timeout=60000", "-c", "tcp_keepalives_idle=30", "-c", "tcp_keepalives_interval=10", "-c", "tcp_keepalives_count=3"]
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notification_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    restart: unless-stopped
    init: true
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256m

  migrate:
    image: ${IMAGE_REGISTRY:-ghcr.io/OWNER}/notification-service-api:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    command: ["python", "-m", "scripts.migrate"]
    restart: "no"
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ${IMAGE_REGISTRY:-ghcr.io/OWNER}/notification-service-api:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    restart: unless-stopped
    init: true
    environment:
      <<: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512m

  worker:
    image: ${IMAGE_REGISTRY:-ghcr.io/OWNER}/notification-service-api:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    command: celery -A app.celery_app worker -B -l info -Q ${CELERY_QUEUE:-notification_service_queue},${CELERY_QUEUE:-notification_service_queue}_high,${CELERY_QUEUE:-notification_service_queue}_low
    restart: unless-stopped
    init: true
    environment:
      <<: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512m

  web:
    image: ${IMAGE_REGISTRY:-ghcr.io/OWNER}/notification-service-web:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    init: true
    environment:
      API_BASE_URL: /api
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
