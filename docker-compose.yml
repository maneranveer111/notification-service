# Commands:
#   Start: docker compose up -d
#   Stop:  docker compose down --remove-orphans
#   Reset: docker compose down -v

name: notification-dev

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-notification_db}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  API_KEY: ${API_KEY:?API_KEY is required}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
  UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:?UNSUBSCRIBE_SECRET is required}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8001}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173,http://localhost:3000}
  FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:5173}
  CELERY_QUEUE: ${CELERY_QUEUE:-notification_service_queue}
  APP_NAME: ${APP_NAME:-Notification Service}
  SIGNUP_MODE: ${SIGNUP_MODE:-open}
  REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-True}
  SYSTEM_MAIL_BACKEND: ${SYSTEM_MAIL_BACKEND:-provider}
  EMAIL_PROVIDER_ORDER: ${EMAIL_PROVIDER_ORDER:-brevo,smtp}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-True}
  BREVO_API_KEY: ${BREVO_API_KEY:-}
  BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL:-}
  BREVO_FROM_NAME: ${BREVO_FROM_NAME:-}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  LOG_FORMAT: ${LOG_FORMAT:-text}

services:
  db:
    image: postgres:16
    command: ["postgres", "-c", "idle_in_transaction_session_timeout=60000", "-c", "tcp_keepalives_idle=30", "-c", "tcp_keepalives_interval=10", "-c", "tcp_keepalives_count=3"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notification_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    command: ["python", "-m", "scripts.migrate"]
    restart: "no"
    environment:
      <<: *backend-env
      MIGRATE_KILL_STALE_SESSIONS: "true"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    environment:
      <<: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "${API_HOST_PORT:-8001}:8001"

  worker:
    build:
      context: ./backend
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    command: celery -A app.celery_app worker -B -l info -Q ${CELERY_QUEUE:-notification_service_queue},${CELERY_QUEUE:-notification_service_queue}_high,${CELERY_QUEUE:-notification_service_queue}_low
    environment:
      <<: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    environment:
      API_BASE_URL: /api
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
