map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain application/javascript application/json text/css image/svg+xml;

    # Docker's internal DNS resolver — re-resolves upstream on each request
    # so Nginx does not cache a stale IP when the API container is recreated.
    resolver 127.0.0.11 valid=30s ipv6=off;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location /api/ {
        # API port is 8001 everywhere (compose command, health check, and this upstream).
        # Use a variable so Nginx re-resolves via the resolver above instead of
        # caching the IP statically at startup.
        # set must come before rewrite so the variable is initialized before the
        # break flag stops further rewrite processing.
        # rewrite strips the /api prefix so the backend receives /public/config etc.
        set $api_upstream http://api:8001;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /config.js {
        expires off;
        add_header Cache-Control no-store;
    }

    location ~* \.(js|css|png|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
