name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: notification_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notification_db
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      API_KEY: ci-test-key
      JWT_SECRET: ci-dummy-jwt-secret-key-that-is-at-least-forty-characters-long
      WEBHOOK_SECRET: ci-webhook-secret-key-1234567890
      UNSUBSCRIBE_SECRET: ci-unsubscribe-secret-key-1234567890
      PUBLIC_BASE_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      CELERY_QUEUE: notification_service_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run database migrations and test suite
        working-directory: backend
        run: |
          alembic upgrade head
          pytest -q

  frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    env:
      VITE_API_BASE_URL: http://localhost:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose config
        run: docker compose config --quiet

      - name: Build backend image
        run: docker compose build api

      - name: Build frontend image
        run: docker compose build web

